source:
  input_dir: ./pdfs
  recursive: true

output:
  root_dir: ./data/bases
  base_name: documentos

paddle_ocr:
  language: pt
  device: cpu
  minimum_confidence: 0.5
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  use_textline_orientation: false

chunking:
  tokenizer_model: gpt-4.1
  chunk_size: 800
  chunk_overlap: 120
  minimum_chunk_size: 80

vector_store:
  enabled: true
  embedding_model: intfloat/multilingual-e5-small
  device: cpu
  batch_size: 32

runtime:
  force: false
  continue_on_error: true

classification:
  min_chars_per_page: 50     # chars mínimos para considerar a página como nativa
  native_threshold: 0.80     # >= 80% páginas com texto → extração nativa (sem OCR)
  scanned_threshold: 0.20    # <= 20% páginas com texto → OCR via PaddleOCR
