; ============================================================
; Oráculo — Supervisor config for the ingestion scheduler
; ============================================================
;
; Install:
;   sudo apt install supervisor          # Debian/Ubuntu
;   sudo dnf install supervisor          # Fedora/RHEL
;   pip install supervisor               # via pip
;
; Deploy:
;   sudo cp configs/supervisor/oraculo-scheduler.conf \
;          /etc/supervisor/conf.d/oraculo-scheduler.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Commands:
;   sudo supervisorctl status oraculo-scheduler
;   sudo supervisorctl start  oraculo-scheduler
;   sudo supervisorctl stop   oraculo-scheduler
;   sudo supervisorctl restart oraculo-scheduler
;   sudo supervisorctl tail -f oraculo-scheduler     # live log
;
; ============================================================

[program:oraculo-scheduler]
; ── Path absoluto do Python dentro do venv do projeto ──
; Ajuste para o caminho real do seu virtualenv.
command=%(ENV_HOME)s/ProjetosEstudos/Oraculo/venv/bin/python -m src.scheduler.worker
    --config configs/ingestion.yml
    --interval 3600

; ── Diretório de trabalho = raiz do projeto ──
directory=%(ENV_HOME)s/ProjetosEstudos/Oraculo

; ── Usuário que roda o processo ──
user=maurelio

; ── Restart automático ──
autorestart=true
startretries=5
startsecs=10

; ── Shutdown graceful (SIGTERM) ──
stopsignal=TERM
stopwaitsecs=120

; ── Logs ──
stdout_logfile=%(ENV_HOME)s/ProjetosEstudos/Oraculo/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_redirect=true

; ── Variáveis de ambiente ──
; Adicione aqui chaves de API ou configurações extras.
; environment=PYTHONUNBUFFERED="1",LLM_PROVIDER="openrouter"
environment=PYTHONUNBUFFERED="1"
